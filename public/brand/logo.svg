<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" fill="none" aria-label="Malabar Roast &amp; Co. Logo">
  <!-- Artisanal Seal -->
  <g transform="translate(6, 6)">
    <!-- Outer fine ring -->
    <circle cx="28" cy="28" r="27" stroke="#A85F37" stroke-width="1.5" stroke-dasharray="2 3" />
    <!-- Main Seal Body -->
    <circle cx="28" cy="28" r="23" fill="#2B1D17" stroke="#A85F37" stroke-width="2" />
    <!-- Botanical shade leaf -->
    <path d="M28 11C30.5 8.5 34 9 35 12.5C33 13 30 12.5 28 11Z" fill="#D4A373" />
    <!-- Roasted Coffee Bean -->
    <path d="M28 15C20.5 15 15.5 21 15.5 28.5C15.5 36 20.5 41.5 28 41.5C35.5 41.5 40.5 36 40.5 28.5C40.5 21 35.5 15 28 15Z" fill="#FFF9F1" />
    <!-- S-curve seam -->
    <path d="M28 17C23.5 22.5 32 26.5 28 33C24.5 38 31 39.5 28 39.5" stroke="#2B1D17" stroke-width="2.5" stroke-linecap="round" />
    <!-- Micro accent dots -->
    <circle cx="9" cy="28" r="1.5" fill="#A85F37" />
    <circle cx="47" cy="28" r="1.5" fill="#A85F37" />
  </g>
  <!-- Wordmark typography -->
  <text x="74" y="34" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="2.5" fill="#2B1D17">
    MALABAR
  </text>
  <text x="74" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#A85F37">
    ROAST &amp; CO. · BENGALURU
  </text>
</svg>
